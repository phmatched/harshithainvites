<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<!-- Everything is inline: a 404 can be served from any depth, so relative
     paths to CSS are not safe here. -->
<style>
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: linear-gradient(165deg, #7C1F1A, #5E1512);
    color: #FDF8F0;
    font-family: Georgia, "Times New Roman", serif;
  }
  .flower { width: 54px; height: 54px; margin-bottom: 20px; }
  h1 { font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 400; margin: 0 0 10px; color: #E3CC8A; }
  p  { margin: 0 0 26px; opacity: .88; font-size: clamp(.95rem, 3.6vw, 1.05rem); }
  a {
    display: inline-block;
    padding: 12px 26px;
    border: 1px solid #E3CC8A;
    border-radius: 999px;
    color: #E3CC8A;
    text-decoration: none;
    letter-spacing: .06em;
    font-size: .9rem;
  }
  a:hover { background: #E3CC8A; color: #5E1512; }
</style>
</head>
<body>
  <main>
    <svg class="flower" viewBox="0 0 64 64" aria-hidden="true">
      <g transform="translate(32 32)" fill="#E3CC8A">
        <ellipse cx="0" cy="-13" rx="6" ry="12.5"/>
        <ellipse cx="0" cy="-13" rx="6" ry="12.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="6" ry="12.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="6" ry="12.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="6" ry="12.5" transform="rotate(288)"/>
      </g>
      <circle cx="32" cy="32" r="6" fill="#C9A227"/>
    </svg>

    <h1>This page doesn&rsquo;t exist</h1>
    <p>But the invitation does.</p>
    <a id="home" href="/">Open the Invitation</a>
  </main>

<script>
  /* On a GitHub project page the site lives under /<repo>/, so send people
     there rather than to the account root. */
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    if (/\.github\.io$/i.test(location.hostname) && parts.length > 1) {
      document.getElementById("home").href = "/" + parts[0] + "/";
    }
  })();
</script>
</body>
</html>
