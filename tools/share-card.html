<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital@0;1&family=Great+Vibes&family=Noto+Serif+Kannada&display=swap">
<style>
  /* Template for the WhatsApp/Facebook share card.
     Do not edit the names here — make_share_card.py fills the {{...}} slots
     from assets/js/data.js.

     Laid out at 960x504 (the 1200x630 share ratio) so it fits inside
     QuickLook's render viewport. No grain layer: high-frequency noise wrecks
     PNG compression and is invisible at thumbnail size. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 504px; overflow: hidden; }
  body { position: relative; }

  .card {
    position: relative;
    width: 960px; height: 504px;
    overflow: hidden;
    background: url("assets/img/wash-hero.png") center / cover no-repeat;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: #4A2C22;
  }

  .toran-wrap { position: absolute; top: 0; left: 0; right: 0; height: 132px; overflow: hidden; }
  .toran { position: absolute; top: 0; left: 50%; width: 1220px; transform: translateX(-50%); }

  .corner { position: absolute; bottom: -6px; width: 250px; }
  .corner--l { left: -14px; }
  .corner--r { right: -14px; }

  .frame {
    position: absolute; inset: 27px 37px 24px;
    border: 2px solid #C9A227;
    outline: 1px solid #E3CC8A;
    outline-offset: 6px;
  }

  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-top: 78px;
    text-align: center;
  }
  .kalasha { width: 37px; margin-bottom: 5px; }
  .invocation { font-family: "Noto Serif Kannada", serif; font-size: 15px; color: #7C1F1A; margin-bottom: 7px; }
  .names {
    font-family: "Great Vibes", cursive;
    font-size: 58px; line-height: 1.06; color: #7C1F1A;
    text-shadow: 0 2px 14px rgba(201,162,39,.3);
  }
  .with { font-style: italic; font-size: 18px; color: #9A711A; line-height: 1.5; }
  .divider { width: 214px; margin: 5px 0 9px; }
  .date {
    font-family: "Cinzel", serif; font-size: 14px;
    letter-spacing: .18em; text-transform: uppercase; color: #7C1F1A; margin-bottom: 5px;
  }
  .venue { font-size: 15px; font-style: italic; color: #7A5A4A; }

  /* Located by the cropper, then trimmed off the finished image. */
  .edge   { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #FF00FF; z-index: 99; }
  .edge-r { position: absolute; top: 0; bottom: 0; right: 0; width: 4px; background: #FF00FF; z-index: 99; }
</style>
</head>
<body>
  <div class="card">
    <div class="toran-wrap"><img class="toran" src="assets/img/toran.svg" alt=""></div>
    <div class="frame"></div>

    <div class="stage">
      <img class="kalasha" src="assets/img/kalasha.svg" alt="">
      <p class="invocation">{{INVOCATION}}</p>
      <p class="names">{{BRIDE}}</p>
      <p class="with">with</p>
      <p class="names">{{GROOM}}</p>
      <img class="divider" src="assets/img/divider.svg" alt="">
      <p class="date">{{DATE}}</p>
      <p class="venue">{{VENUE}}</p>
    </div>

    <img class="corner corner--l" src="assets/img/corner-left.svg" alt="">
    <img class="corner corner--r" src="assets/img/corner-right.svg" alt="">
    <div class="edge"></div>
    <div class="edge-r"></div>
  </div>
</body>
</html>
